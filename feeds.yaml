# AI Radar kaynak listesi
# Yeni kaynak eklemek için ilgili kategorinin altına name + url yazman yeterli.
#
# Not: *.substack.com adresleri GitHub sunucularından 403 veriyor; kendi alan adı olan
# Substack'ler (örn. www.oneusefulthing.org/feed) çalışıyor.
#
# Kaynak ayarları (hepsi isteğe bağlı; "hours" kategoriye de yazılabilir):
#   filter: true  -> sadece "interests" listesindeki kelimeleri içeren yazıları al
#                    (arXiv gibi günde yüzlerce yazı gelen kaynaklar için)
#   limit: 15     -> bu kaynaktan en fazla kaç yazı gösterilsin
#   hours: 168    -> bu kaynakta son kaç saate bakılsın (az paylaşan kaynaklar için)

settings:
  hours: 36            # son kaç saatteki yazılar taransın
  default_limit: 8     # kaynak başına varsayılan yazı sayısı
  highlight_min: 2     # en az kaç etiket geçen yazı "öne çıkanlar"a girsin

# İlgi alanların: bu kelimeler geçen yazılar üste çıkar ve rozetle işaretlenir.
# Bu liste sitedeki VARSAYILAN etiketlerdir; sitede değiştirdiklerin sadece o tarayıcıda kalır.
# Küçük/büyük harf fark etmez. Çekimli halleri de bulunur
# (llm -> LLMs, quantization -> quantized, fine-tuning -> fine-tuned).
interests:
  # Modeller ve sürümler
  - llm
  - open model
  - open-weight
  - open-source
  - frontier model
  - multimodal
  - vision-language
  - reasoning
  # Agent'lar ve araçlar
  - agent
  - agentic
  - tool use
  - function calling
  - mcp
  - coding agent
  - rag
  # Eğitim ve verimlilik
  - fine-tuning
  - rlhf
  - reinforcement learning
  - distillation
  - quantization
  - mixture of experts
  - small language model
  - inference
  - context window
  # Değerlendirme ve güvenlik
  - benchmark
  - interpretability
  - alignment
  - ai safety
  # Senin için
  - türkçe
  - turkish

categories:
  - name: "🔬 Makaleler"
    feeds:
      - name: arXiv cs.CL (NLP)
        url: https://rss.arxiv.org/rss/cs.CL
        filter: true
        limit: 15
      - name: arXiv cs.LG
        url: https://rss.arxiv.org/rss/cs.LG
        filter: true
        limit: 10
      - name: arXiv cs.AI
        url: https://rss.arxiv.org/rss/cs.AI
        filter: true
        limit: 10
      - name: HF Daily Papers   # resmi olmayan ayna
        url: https://papers.takara.ai/api/feed
        limit: 15

