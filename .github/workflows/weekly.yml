name: Haftalık özet

on:
  schedule:
    - cron: "0 6 * * 0"   # her pazar 06:00 UTC = 09:00 Türkiye saati
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  digest:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Istanbul
      SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Özeti hazırla
        run: python digest.py --restore "$SITE_URL" --out digest.md --mention "${{ github.repository_owner }}"

      - name: Issue aç (GitHub sana e-posta gönderir)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "📡 Haftalık AI Radar · $(date +%d.%m.%Y)" --body-file digest.md
