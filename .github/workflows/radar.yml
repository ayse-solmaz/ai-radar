name: AI Radar

on:
  schedule:
    - cron: "0 5 * * *"   # her gün 05:00 UTC = 08:00 Türkiye saati
  workflow_dispatch:       # Actions sekmesinden elle de çalıştırılabilir
    inputs:
      all:
        description: "Daha önce gösterilenleri de tekrar göster"
        type: boolean
        default: false

permissions:
  contents: write   # seen.json'u kaydetmek için
  pages: write
  id-token: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      TZ: Europe/Istanbul
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - id: pages
        uses: actions/configure-pages@v5

      - name: Kaynakları tara ve siteyi üret
        run: python radar.py --publish --no-open --restore "${{ steps.pages.outputs.base_url }}" ${{ inputs.all && '--all' || '' }}

      - name: seen.json'u kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen.json
          git commit -m "Radar taraması: $(date +%Y-%m-%d)" || echo "değişiklik yok"
          git push

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
