name: AI Radar

on:
  # GitHub zamanlamaları garanti değil: saat başında (:00) sık sık gecikiyor ya da atlanıyor.
  # Bu yüzden sakin bir dakika + yedek bir saat; o gün tarama yapıldıysa yedek hiçbir şey yapmaz.
  schedule:
    - cron: "17 4 * * *"   # 07:17 Türkiye saati
    - cron: "47 6 * * *"   # 09:47 yedek
  workflow_dispatch:       # Actions sekmesinden elle de çalıştırılabilir
    inputs:
      all:
        description: "Daha önce gösterilenleri de tekrar göster"
        type: boolean
        default: false

permissions:
  contents: write   # seen.json'u kaydetmek için
  pages: write
  id-token: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  # Zamanlanmış çalışmada: bugün zaten tarandıysa (canlı arşivde bugünün tarihi varsa) atla.
  # Yoksa ikinci tarama, sayfayı sadece aradaki birkaç yeni yazıyla değiştirirdi.
  check:
    runs-on: ubuntu-latest
    outputs:
      done_today: ${{ steps.check.outputs.done_today }}
    env:
      TZ: Europe/Istanbul
    steps:
      - id: check
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] &&
             curl -fs "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/archive/list.json" |
             grep -q "\"$(date +%Y-%m-%d)_"; then
            echo "Bugün zaten tarandı, atlanıyor."
            echo "done_today=true" >> "$GITHUB_OUTPUT"
          fi

  radar:
    needs: check
    if: needs.check.outputs.done_today != 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      TZ: Europe/Istanbul
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - id: pages
        uses: actions/configure-pages@v5

      - name: Kaynakları tara ve siteyi üret
        run: python radar.py --publish --no-open --restore "${{ steps.pages.outputs.base_url }}" ${{ inputs.all && '--all' || '' }}

      - name: seen.json'u kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen.json
          git commit -m "Radar taraması: $(date +%Y-%m-%d)" || echo "değişiklik yok"
          git push

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
